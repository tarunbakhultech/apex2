services:
  - type: web
    name: apex2-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false          # paste your Atlas URI in the Render dashboard, never in git
      - key: MONGODB_DATABASE
        value: apex2
      - key: CORS_ORIGINS
        value: http://localhost:5173
